<text x="967" y="472" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#9A9A9A" font-weight="400">原创界面与代码</text>
<text x="967" y="525" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#9A9A9A" font-weight="400">按依赖打通完整工作流</text>
