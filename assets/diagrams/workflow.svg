<text x="1397" y="408" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="48" fill="#EAEAEA" font-weight="700">验收与修复</text>
<text x="1397" y="472" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#9A9A9A" font-weight="400">静态检查 / 真机</text>
