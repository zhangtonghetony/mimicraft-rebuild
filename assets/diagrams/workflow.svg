<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="860" viewBox="0 0 1800 860" role="img" aria-labelledby="title"><title id="title">四阶段工作流及验证反馈</title><rect width="1800" height="860" fill="#050505"/>
<text x="80" y="104" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="49" fill="#EAEAEA" font-weight="400">01 / THE REBUILD LOOP</text>
<text x="80" y="169" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="34" fill="#9A9A9A" font-weight="400">先研究行为，再确认方案；开发与验收按同一份规格推进。</text>
