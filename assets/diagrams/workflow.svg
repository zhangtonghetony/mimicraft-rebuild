<text x="537" y="472" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#9A9A9A" font-weight="400">Markdown / 用例</text>
<text x="537" y="525" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#9A9A9A" font-weight="400">产品形态与技术栈先确认</text>
